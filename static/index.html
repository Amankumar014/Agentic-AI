<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Monitor - Camera Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            background: #eef2ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #eef2ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }
        
        .camera-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 14px;
        }
        
        #fileInput {
            display: none;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .preview {
            display: none;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .results {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9ff;
        }
        
        .results.success {
            border-left: 5px solid #10b981;
        }
        
        .results.alert {
            border-left: 5px solid #ef4444;
            background: #fef2f2;
        }
        
        .results h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            font-weight: 600;
            color: #666;
        }
        
        .result-value {
            color: #333;
        }
        
        .alert-box {
            background: #fee;
            border: 2px solid #ef4444;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            color: #991b1b;
            font-weight: 600;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border-left: 5px solid #ef4444;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            color: #991b1b;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👶 Baby Monitor</h1>
        <p class="subtitle">Upload a photo to analyze baby's safety</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="camera-icon">📸</div>
            <div class="upload-text">Tap to take photo or upload</div>
            <div class="upload-hint">Supports: JPG, PNG, JPEG</div>
        </div>
        
        <input type="file" id="fileInput" accept="image/*" capture="environment">
        
        <div class="preview" id="preview">
            <img id="previewImg" src="" alt="Preview">
        </div>
        
        <button class="btn btn-primary" id="analyzeBtn" style="display: none;">
            🔍 Analyze Frame
        </button>
        
        <button class="btn btn-secondary" id="clearBtn" style="display: none;">
            🔄 Take Another Photo
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Analyzing frame with Azure AI Vision...</div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="results" id="results"></div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        
        let selectedFile = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please select an image file');
                return;
            }
            
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
                analyzeBtn.style.display = 'block';
                clearBtn.style.display = 'block';
                uploadArea.style.display = 'none';
                results.style.display = 'none';
                error.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        // Analyze button
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            
            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                const response = await fetch('/api/v1/frames/', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (err) {
                showError(`Error: ${err.message}`);
            } finally {
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        // Clear button
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            preview.style.display = 'none';
            analyzeBtn.style.display = 'none';
            clearBtn.style.display = 'none';
            uploadArea.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
        });
        
        function displayResults(data) {
            const analysis = data.analysis || {};
            const isAlert = data.alert || false;
            
            results.className = 'results ' + (isAlert ? 'alert' : 'success');
            
            let html = '<h3>📊 Analysis Results</h3>';
            
            html += '<div class="result-item">';
            html += '<span class="result-label">Baby Detected:</span>';
            html += `<span class="result-value">${analysis.baby_detected ? '✅ Yes' : '❌ No'}</span>`;
            html += '</div>';
            
            html += '<div class="result-item">';
            html += '<span class="result-label">Movement Level:</span>';
            html += `<span class="result-value">${analysis.movement_level || 'Unknown'}</span>`;
            html += '</div>';
            
            html += '<div class="result-item">';
            html += '<span class="result-label">Position:</span>';
            html += `<span class="result-value">${analysis.position || 'Unknown'}</span>`;
            html += '</div>';
            
            html += '<div class="result-item">';
            html += '<span class="result-label">Risk Level:</span>';
            html += `<span class="result-value">${analysis.risk || 'Unknown'}</span>`;
            html += '</div>';
            
            if (analysis.notes) {
                html += '<div class="result-item">';
                html += '<span class="result-label">Notes:</span>';
                html += `<span class="result-value">${analysis.notes}</span>`;
                html += '</div>';
            }
            
            if (isAlert) {
                html += '<div class="alert-box">';
                html += `🚨 ALERT: ${data.reason || 'Alert triggered!'}`;
                html += '</div>';
            }
            
            results.innerHTML = html;
            results.style.display = 'block';
        }
        
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
